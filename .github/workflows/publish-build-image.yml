name: Publish and Build Docker Image

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-build-image.yml
      - Dockerfile
      - versions.env
      - install_s6.sh
      - fake_sysctl.sh
      - default_qbittorrent.conf
      - s6-rc.d/**

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned versions
        id: versions
        run: cat versions.env >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ github.repository }}
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          build-args: |
            DEBIAN_IMAGE=${{ steps.versions.outputs.DEBIAN_IMAGE }}
            QBITTORRENT_VERSION=${{ steps.versions.outputs.QBITTORRENT_VERSION }}
            QBITTORRENT_DEB_REVISION=${{ steps.versions.outputs.QBITTORRENT_DEB_REVISION }}
            S6_OVERLAY_VERSION=${{ steps.versions.outputs.S6_OVERLAY_VERSION }}
          tags: |
            ${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:qbittorrent-${{ steps.versions.outputs.QBITTORRENT_VERSION }}
          labels: |
            ${{ steps.meta.outputs.labels }}
