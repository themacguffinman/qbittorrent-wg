name: Test Docker Image

on:
  pull_request:
    paths:
      - .github/workflows/test-image.yml
      - tests/**
      - Dockerfile
      - versions.env
      - install_s6.sh
      - fake_sysctl.sh
      - default_qbittorrent.conf
      - s6-rc.d/**

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: qbittorrent-wg:test
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned versions
        id: versions
        run: cat versions.env >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            DEBIAN_IMAGE=${{ steps.versions.outputs.DEBIAN_IMAGE }}
            QBITTORRENT_VERSION=${{ steps.versions.outputs.QBITTORRENT_VERSION }}
            QBITTORRENT_DEB_REVISION=${{ steps.versions.outputs.QBITTORRENT_DEB_REVISION }}
            S6_OVERLAY_VERSION=${{ steps.versions.outputs.S6_OVERLAY_VERSION }}
      - name: Load WireGuard kernel module
        run: sudo modprobe wireguard
      - name: Smoke test
        run: bash tests/smoke.sh "$IMAGE"
